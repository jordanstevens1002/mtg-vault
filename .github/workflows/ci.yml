name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vault -d vault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vault:test@localhost:5432/vault_test
      TEST_DATABASE_URL: postgresql+psycopg://vault:test@localhost:5432/vault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repository baseline
        run: test -s LICENSE && test -s CONTRIBUTING.md && test -s SECURITY.md
      - name: Backend
        run: |
          if [ -f backend/pyproject.toml ]; then
            pip install -c backend/requirements.lock -e 'backend[dev]'
            pip check
            ruff check backend
            ruff format --check backend
            mypy --config-file backend/pyproject.toml backend/vault
            pytest backend/tests
          fi
      - name: Frontend
        run: |
          if [ -f frontend/package-lock.json ]; then
            cd frontend
            npm ci
            npm run check
            npm test
            npm run build
          fi
      - name: Compose configuration
        run: |
          if [ -f compose.yml ]; then
            cp .env.example .env
            docker compose config --quiet
          fi
      - name: Generated API contract
        run: |
          if [ -f frontend/src/generated/api.ts ]; then
            python scripts/export_openapi.py > /tmp/mtg-openapi.json
            cd frontend
            npx openapi-typescript /tmp/mtg-openapi.json -o src/generated/api.ts
            git diff --exit-code -- src/generated/api.ts
          fi
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cp .env.example .env
      - name: Start isolated application
        run: docker compose up --build -d db migrate api web
      - name: Load explicit smoke catalogue
        run: docker compose exec -e VAULT_ALLOW_FIXTURES=1 -T api python - < scripts/seed_smoke.py
      - name: Browser journeys
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Backup and restore smoke data
        run: |
          bash scripts/backup.sh /tmp/mtg-vault.dump
          VAULT_RESTORE_CONFIRM=replace bash scripts/restore.sh /tmp/mtg-vault.dump
          docker compose run --rm migrate
          docker compose up -d api web
          curl --retry 10 --retry-all-errors --retry-delay 2 --fail http://localhost:8080/api/v1/health
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results/
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 100
