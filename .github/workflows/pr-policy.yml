name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const conventional = /^(feat|fix|docs|test|refactor|build|ci|chore|perf|revert)(\([\w./-]+\))?!?: .+/;
            if (!conventional.test(pr.title)) core.setFailed('Use a Conventional Commit PR title.');
            if (pr.base.ref === 'main' && pr.head.ref !== 'develop') core.setFailed('Release PRs must promote develop to main.');
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 });
            let reviewed = 0, generated = 0;
            for (const file of files) {
              const exempt = /(^|\/)(package-lock.json|requirements.lock|LICENSE)$|generated|vendor/.test(file.filename);
              if (exempt) generated += file.additions + file.deletions;
              else reviewed += file.additions + file.deletions;
            }
            await core.summary.addHeading('PR size').addRaw(`${reviewed} human-reviewed changed lines; ${generated} generated/licence lines.`).write();
            if (reviewed > 1000) core.warning('Above initial-review guidance; explain why this PR is cohesive or split it.');
            if (reviewed > 1500) core.warning('Above review headroom; maintainer agreement and a split should be considered.');
