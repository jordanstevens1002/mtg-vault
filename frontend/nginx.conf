server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 8m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(self), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }
  location /ocr/ { try_files $uri =404; }
  location ~ \.mjs$ { default_type application/javascript; try_files $uri =404; }
  # OpenCV's generated runtime needs JavaScript evaluation only inside this worker.
  location ~ ^/assets/paddle\.worker-.*\.js$ {
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'none'; object-src 'none'" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
