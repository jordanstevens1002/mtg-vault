[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-vault"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "ijson>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
include = ["vault*"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ijson", "ijson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
