services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vault}
      IMAGE_CACHE_DIR: /cache
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    environment: *backend-env
    volumes: ["images:/cache"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  sync:
    build: ./backend
    environment: *backend-env
    command: ["python", "-m", "vault.sync"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres:
  images:
